# Settings for `cargo about`; tools/licenses/generate.sh runs it.
# The notices cover what the macOS release zip ships: the two macOS targets, normal dependencies only.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
# qtable's own crates (publish = false, GPL-3.0-or-later) are not third-party.
private = { ignore = true }
# Allowed, permissive licences. A dependency under none of these fails generation, so a new
# copyleft-incompatible dependency shows up early. When a crate offers "A OR B", cargo about
# accepts the expression if any one alternative is listed here.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
